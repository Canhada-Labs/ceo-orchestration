name: Smoke Install

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/upgrade.sh"
      # PLAN-161 (CI wiring): upgrade oracles + the manifest lib they
      # exercise — keep BOTH filter lists (pull_request + push) in sync.
      - "scripts/_framework_manifest_set.sh"
      # The ownership + parity e2e call _hash_file/_hash_stdin from here, and
      # this workflow is their ONLY CI execution — without the helper in the
      # filter, a PR touching only it skips the gate entirely (codex W1
      # round 10, P2: the "red gate nobody runs" class, one level deeper).
      - "scripts/_hash_lib.sh"
      - "scripts/tests/test-upgrade-dryrun-identity.sh"
      - "scripts/tests/test-upgrade-exclusions.sh"
      - "scripts/tests/smoke-install.sh"
      # PLAN-166 F4 (OQ-4): the install/upgrade parity e2e and its classifier.
      # The finding this closes is "a red gate nobody runs" (5th instance) --
      # an unwired test is the same as no test.
      - "scripts/tests/test-install-upgrade-parity-e2e.sh"
      - "scripts/tests/_parity_classify.py"
      # PLAN-183 W5 (D1/D3): the SHARED delivery-route table. Three consumers
      # read it — _parity_classify.py, doctor.sh and (D3) the canonical
      # manifest generator — and until now a typo confined to the table fired
      # NO e2e at all (grep count 0 in both lists, measured S325). A canonical
      # script reads it now, so the gate has to light up on the table itself.
      - "scripts/delivery-routes.tsv"
      # PLAN-183 W5 (D1 + OQ-5): the historical-adopter e2e. Same wiring rule
      # as every scripts/tests/*.sh above — unwired = no test. It is the ONLY
      # check that exercises the OQ-5 amendment, because the parity e2e's
      # pinned route always has a recorded ceremony.
      - "scripts/tests/test-upgrade-historical-adopter.sh"
      # rail round-1 F6: the route-resolution oracle for the CANONICAL manifest
      # generator (D3). Measured S327: it was referenced by NOTHING but itself
      # — no step invoked it and neither path filter named it — so its
      # installer-versus-table checks and its malformed-row controls never ran
      # in CI. Unwired = no test, the same rule the two entries above obey.
      - "scripts/tests/test-manifest-delivery-route.sh"
      # rail round-2 F4: doctor.sh's HALF of the same route table. Measured
      # S327: zero references in .github/, so the new restore/confinement
      # cases (59 assertions, ~107 s local) never executed in CI either. Same
      # rule, third instance. `scripts/doctor.sh` is already in this list.
      - "scripts/tests/test-doctor-delivery-route.sh"
      # PLAN-185 W1+W2 (AC-3): the installer write-confinement e2e. Same
      # wiring rule as every scripts/tests/*.sh above — unwired = no test,
      # and this workflow is their ONLY CI execution. It is the sole check
      # that a destination symlink/hardlink cannot make install.sh write
      # OUTSIDE $TARGET, so a PR touching only the e2e (or only the library
      # predicate it exercises) must light this gate up. The three scripts it
      # covers — install.sh, upgrade.sh, _framework_manifest_set.sh — are
      # already in this list.
      - "scripts/tests/test-installer-write-safety-e2e.sh"
      # PLAN-169 W-E (S329, rail round-1 P2): the hook-roster derivation e2e.
      # Same rule, fourth instance — it was born with no step and no filter
      # entry, so E.1-E.10 would never have run. The TEMPLATE it derives from
      # is already covered by `templates/**` below, which is the other half of
      # what makes this gate meaningful: adding a hook to settings.base.json
      # is exactly the event this test exists to watch.
      - "scripts/tests/test-upgrade-lifecycle-hooks-derived.sh"
      # PLAN-166 F3 (ADR-155-AMEND-1): delivery-record ownership e2e —
      # scripts/tests/*.sh runs ONLY in this workflow (same r11/r20 wiring
      # rule as the parity e2e above).
      - "scripts/tests/test-upgrade-spec-ownership.sh"
      # PLAN-168 W1 (AC-1): the PLAN-167 ownership oracles + their truth
      # table + contract doc. The unit oracle runs per-PR in THIS workflow;
      # the ~25-min e2e runs in ownership-nightly.yml (schedule: ignores
      # paths:, so it cannot live behind this filter) — but a PR touching
      # the table/harness/contract must still light up the fast gate here.
      # Without these entries, a PR changing only the table skips the gate
      # entirely: the r10-F4 "red gate nobody runs" class, again.
      - "scripts/tests/test-ownership-verdict-unit.sh"
      - "scripts/tests/test-ownership-table.sh"
      - "scripts/tests/ownership_table.tsv"
      - "docs/ownership-decision-table.md"
      # Re-pass rc.4 t7 P2: the per-PR gitignore unit must light this gate
      # up when it (or the generator it exercises) changes.
      - "scripts/tests/test-gitignore-symlink-and-dryrun-unit.sh"
      # S313: the schema-generation pin guard + the two schema docs it
      # protects. A commit that changes PLAN-SCHEMA/DEBATE-SCHEMA without
      # appending the replaced generation's hash to upgrade.sh must light
      # THIS gate up — otherwise the guard is a red gate nobody runs.
      - "scripts/tests/test-schema-generation-pins-unit.sh"
      - ".claude/plans/PLAN-SCHEMA.md"
      - ".claude/plans/DEBATE-SCHEMA.md"
      # PLAN-168 W1+W2 (rail r3 P1): the nightly gate + its positive control
      # get fast per-PR steps HERE too — without these entries a PR could
      # break the gate's rc/status handling while every PR check stays green.
      # The pointer-generator render control is the per-PR half of INV-4
      # (the full 4-leg e2e runs in ownership-nightly.yml).
      - "scripts/tests/ownership-nightly-gate.sh"
      - "scripts/tests/test-ownership-nightly-gate.sh"
      - "scripts/tests/ownership-expected-reds.txt"
      - "scripts/tests/test-protocol-pointer-render.sh"
      - "scripts/tests/test-protocol-pointer-inv4.sh"
      # PLAN-177 W1 (CF-9): the night-mode ignore EFFICACY e2e. Same
      # wiring rule as every scripts/tests/*.sh above — unwired = no test.
      # It installs at the PIN, so it also depends on the parity e2e
      # (--print-pin) and on the .gitignore generator in the manifest lib,
      # both already in this list.
      - "scripts/tests/test-night-mode-ignore-effect.sh"
      # t8 P2: the efficacy test hardcodes the paths night-mode.py emits —
      # a PR changing only the emitter must light this gate up too.
      - ".claude/scripts/night-mode.py"
      - "templates/**"
      # Widened from SPEC/v1/install-cli.md: SPEC/v1 is delivered by install.sh
      # and (until F3) by nothing in upgrade.sh, so ANY SPEC/v1 change is a
      # parity event, not just the CLI contract doc.
      - "SPEC/v1/**"
      # PLAN-166 F4 wiring (r11/r20): scripts/tests/*.sh runs ONLY here, so a
      # PR touching just one of these would otherwise skip the regression.
      - "scripts/doctor.sh"
      - ".claude/.framework-version"
      - ".claude/scripts/check-framework-updates.sh"
      - ".github/workflows/smoke-install.yml"
      # PLAN-006 Phase 1 (Sprint 6): Adapter Layer migration changes
      # install-time expectations (hook import paths, contract). Scope
      # broadened for the sprint; narrow back post-Sprint-7 closeout.
      - ".claude/hooks/**"
  push:
    branches:
      - main
    paths:
      # KEEP IDENTICAL to the pull_request list above. The two had already
      # drifted (push was missing SPEC/v1 and this workflow file); PLAN-166 F4
      # re-syncs them, because a filter that fires on the PR and not on the
      # merge is a gate with a hole in it.
      - "scripts/install.sh"
      - "scripts/upgrade.sh"
      - "scripts/_framework_manifest_set.sh"
      - "scripts/_hash_lib.sh"
      - "scripts/tests/test-upgrade-dryrun-identity.sh"
      - "scripts/tests/test-upgrade-exclusions.sh"
      - "scripts/tests/smoke-install.sh"
      - "scripts/tests/test-install-upgrade-parity-e2e.sh"
      - "scripts/tests/_parity_classify.py"
      # PLAN-183 W5 (D1/D3) — KEEP IDENTICAL to the pull_request list above.
      - "scripts/delivery-routes.tsv"
      - "scripts/tests/test-upgrade-historical-adopter.sh"
      - "scripts/tests/test-manifest-delivery-route.sh"   # rail round-1 F6
      - "scripts/tests/test-doctor-delivery-route.sh"     # rail round-2 F4
      - "scripts/tests/test-installer-write-safety-e2e.sh"  # PLAN-185 W1+W2
      # PLAN-169 W-E (S329) — KEEP IDENTICAL to the pull_request list above.
      - "scripts/tests/test-upgrade-lifecycle-hooks-derived.sh"
      - "scripts/tests/test-upgrade-spec-ownership.sh"
      - "scripts/tests/test-ownership-verdict-unit.sh"
      - "scripts/tests/test-ownership-table.sh"
      - "scripts/tests/ownership_table.tsv"
      - "docs/ownership-decision-table.md"
      # Re-pass rc.4 t7 P2: the per-PR gitignore unit must light this gate
      # up when it (or the generator it exercises) changes.
      - "scripts/tests/test-gitignore-symlink-and-dryrun-unit.sh"
      # S313: the schema-generation pin guard + the two schema docs it
      # protects. A commit that changes PLAN-SCHEMA/DEBATE-SCHEMA without
      # appending the replaced generation's hash to upgrade.sh must light
      # THIS gate up — otherwise the guard is a red gate nobody runs.
      - "scripts/tests/test-schema-generation-pins-unit.sh"
      - ".claude/plans/PLAN-SCHEMA.md"
      - ".claude/plans/DEBATE-SCHEMA.md"
      # PLAN-168 W1+W2 (rail r3 P1): the nightly gate + its positive control
      # get fast per-PR steps HERE too — without these entries a PR could
      # break the gate's rc/status handling while every PR check stays green.
      # The pointer-generator render control is the per-PR half of INV-4
      # (the full 4-leg e2e runs in ownership-nightly.yml).
      - "scripts/tests/ownership-nightly-gate.sh"
      - "scripts/tests/test-ownership-nightly-gate.sh"
      - "scripts/tests/ownership-expected-reds.txt"
      - "scripts/tests/test-protocol-pointer-render.sh"
      - "scripts/tests/test-protocol-pointer-inv4.sh"
      # PLAN-177 W1 (CF-9): the night-mode ignore EFFICACY e2e. Same
      # wiring rule as every scripts/tests/*.sh above — unwired = no test.
      # It installs at the PIN, so it also depends on the parity e2e
      # (--print-pin) and on the .gitignore generator in the manifest lib,
      # both already in this list.
      - "scripts/tests/test-night-mode-ignore-effect.sh"
      # t8 P2: the efficacy test hardcodes the paths night-mode.py emits —
      # a PR changing only the emitter must light this gate up too.
      - ".claude/scripts/night-mode.py"
      - "templates/**"
      - "SPEC/v1/**"
      - "scripts/doctor.sh"
      - ".claude/.framework-version"
      - ".claude/scripts/check-framework-updates.sh"
      - ".github/workflows/smoke-install.yml"
      - ".claude/hooks/**"

concurrency:
  group: smoke-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # PLAN-012 Phase 2 CEO_SOTA_DISABLE parity.
    if: vars.CEO_SOTA_DISABLE != '1'
    runs-on: ubuntu-latest
    # PLAN-161: 5 -> 8 — headroom for the two upgrade oracles (each runs
    # full install + upgrade legs against fixture adopter repos).
    # PLAN-166 F4: 8 -> 20. MEASURED, not guessed. The parity e2e runs 2 full
    # install legs + 1 upgrade leg PER ceremony mode, and the positive control
    # runs the same again with a planted divergence: 12 install/upgrade
    # operations added to this job. Local wall time (Darwin arm64, 16 cores,
    # 2026-08-05): gate 122s + control 118s = 240s. A 2-core ubuntu-latest
    # runner is the usual 2-3x slower, i.e. 8-12 min of NEW work on top of the
    # ~5 min this job already spent. 15 would sit inside the noise band, and
    # the perf-gate N=20 flake (PLAN-159) was exactly that mistake. Re-tighten
    # once real CI runs give a p95.
    # PLAN-166 F3 (assembler): 20 -> 25. The spec-ownership e2e adds 4 more
    # installs + 3 upgrades (S1-S8; ~3-4 min local per the W1-C measurement),
    # i.e. up to ~8-10 more CI minutes at the same 2-3x factor. Same
    # anti-flake sizing rule as the F4 bump above.
    # PLAN-177 W1 (CF-9): 25 -> 32. The night-mode efficacy e2e adds 3 installs
    # + 2 upgrades. MEASURED, not guessed: 2m06s wall on Darwin arm64 (16
    # cores, 2026-08-13), reproduced across two runs. At the same 2-3x runner
    # factor this workflow already sizes with, that is 4-7 CI minutes, so +7.
    # A job-level timeout that clips a green run reports as `cancelled` on an
    # innocent step (the S2xx lesson), so the margin stays deliberate.
    # PLAN-183 W5 (D1 + OQ-5): 32 -> 50. The historical-adopter e2e adds 2
    # installs + 8 full upgrades (six independent adopter fixtures; the two
    # installs are cached and cp -R'd, the upgrades cannot be). MEASURED, not
    # guessed: 357 s wall on Darwin arm64 under concurrent load, 2026-08-24
    # (372 s for the uncached version — the machine was contended, so treat
    # these as an upper bound, not a p50). At the same 2-3x runner factor this
    # file already sizes with, that is 12-18 CI minutes of NEW work, so +18.
    # The `if: always()` steps below also mean a RED main gate no longer ends
    # the job early: the worst case now runs every step, which is the point.
    # rail round-1 (F2 + F5): 50 -> 58. The two new legs of that e2e — H.12
    # (an unclaimed rendered CODEOWNERS must suppress the .template route, on
    # the first upgrade AND the second) and H.13 (a poisoned route row is
    # refused and NOTHING lands outside $TARGET) — add TWO cached fixtures
    # (cp -R, cheap) and THREE more full upgrades: 8 -> 11.
    # MEASURED, not extrapolated from the count: 9m12s wall on Darwin arm64
    # for the 11-upgrade version while a second e2e lane ran concurrently
    # (2026-08-24) — an upper bound under deliberate contention, against the
    # 357 s the 8-upgrade version measured. Scaling the solo figure by the
    # upgrade count gives ~491 s, i.e. ~+2.2 min solo, which at the same 2-3x
    # runner factor is +5-7 CI minutes, so +8 with the anti-flake margin this
    # file's doctrine requires.
    # The deepen step and the delivery-route oracle added below are seconds
    # and are not what moved this number.
    # rail round-2 (F2 + F3 + F4): 58 -> 68. Two sources, both MEASURED on
    # Darwin arm64 (2026-08-24), neither extrapolated from a count:
    #   (a) the historical e2e went 11 -> 13 upgrades (H.14 runs a real
    #       `--pin v1.3.0` upgrade against a throwaway source repo it builds
    #       from two `git archive` extractions — 7 s; H.15 adds one more
    #       upgrade against a hostile route table). 552 s -> 650 s wall under
    #       comparable contention, i.e. +98 s solo => +3-5 CI minutes at the
    #       2-3x runner factor this file sizes with.
    #   (b) the doctor delivery-route oracle wired below: 104 s wall, 59
    #       assertions => +4-5 CI minutes at the same factor.
    # +10 with the anti-flake margin this file's doctrine requires: a
    # job-level timeout that clips a GREEN run surfaces as `cancelled` on an
    # innocent step (the S2xx lesson). Re-tighten on a real CI p95, never on
    # arithmetic.
    # PLAN-185 W1+W2 (AC-3): 68 -> 83. The installer write-confinement e2e
    # wired below runs ~13 real installs across an F0 unit section plus 15
    # e2e fixtures. MEASURED on Darwin arm64, 2026-08-26 — TWO runs, because
    # the first one is not a p50 and saying so matters more than a tidy
    # number: 2m49s at 87% CPU (62 assertions), then 4m42s at 55% CPU (63
    # assertions, file sha256 83e8ed3c…) with another night-run lane doing
    # its own installs. Same suite, 1.7x spread — the machine, not the test.
    # Sized on the UPPER bound: 282 s x the 2-3x runner factor this file
    # already uses = 9-14 CI minutes of NEW work, so +15 with the anti-flake
    # margin the doctrine above requires. Re-tighten on a real CI p95, never
    # on arithmetic — and never on the faster of two local runs.
    # PLAN-169 W-E (S329, rail rounds 1-3): 83 -> 126. The hook-roster
    # derivation e2e wired below is a whole new e2e, not a leg on an existing
    # one: 11 adopter fixtures (one real install, ten cp -R from the cache)
    # and 15 full upgrades, two of them --dry-run.
    # MEASURED on Darwin arm64, 2026-08-26, 51 assertions, rc=0 — and measured
    # TWICE on purpose, because the two numbers disagree by 45%:
    #   854 s  SOLO   <- the basis for this budget
    #   1233 s with a second full e2e lane running concurrently
    # The blocks above size from contended figures and call them upper bounds;
    # doing that here would have compounded two pessimisms, so the solo run is
    # the basis and the contended one is recorded as the observed spread. At
    # the 2-3x runner factor this file sizes with, 854 s is 28-43 CI minutes of
    # NEW work; +43 takes the top of that range and adds the anti-flake margin.
    # (An earlier revision of this block read 101, sized from the 649 s the
    # 12-upgrade version measured UNDER CONTENTION — lower than the solo figure
    # of the 15-upgrade version, i.e. too tight. Left visible because "a
    # contended measurement is not automatically the conservative one" is the
    # part that was counter-intuitive.)
    # NOTE the asymmetry this file keeps re-learning: over-sizing costs
    # nothing on a green run, while under-sizing reports as `cancelled` on an
    # innocent step. The FIRST real CI run of this step is the number that
    # should replace this estimate — re-tighten on that p95, never on
    # arithmetic.
    # RE-DERIVED on the S329 morning, per item: this block was written as
    # 68 -> 111 against a base that PLAN-185 W1+W2 had meanwhile taken to 83
    # (its own e2e, +15, landed first in cc00235). The two e2e are ADDITIVE
    # in this one job, so E's +43 lands on 83, not on 68: 126. Composing
    # by taking the larger of the two (111) would have under-sized the job
    # by exactly the PLAN-185 step — the `cancelled`-on-an-innocent-step
    # class the doctrine above exists to prevent.
    # PLAN-186 W4a (S343): 126 -> 150 — the first number in this block
    # sized on MEASURED wall instead of on additive step arithmetic. Every
    # block above composes per-step estimates; the samples below give an
    # observed RANGE for this job, which the arithmetic never had. They do
    # NOT say what causes the spread — see the note under the table.
    # Instrument: wall of the JOB `smoke` (startedAt -> completedAt), which
    # is what `timeout-minutes` gates. The RUN wall is 1-5 min longer and is
    # NOT the right instrument — an earlier note in the project memory read
    # `1h32` off a RUN, which is the same run measured as 92m32s here.
    # Read with `gh run view <id> --json jobs`, seven most recent GREEN runs
    # of this workflow, newest first (2026-09-03):
    #   33809424817  92m32s   35f33a8
    #   33743649231  90m40s   ba15c71
    #   33630753302  77m53s   8efe09b
    #   33582381725  87m50s   f0e98de
    #   33503515412  86m52s   b7dad83
    #   33388608651  86m44s   826688f
    #   33364620284  73m18s   f348ee9
    # min 73m18s, max 92m32s. What that establishes is the observed RANGE
    # and nothing more: the seven runs share this workflow definition but
    # NOT the executed workload — 826688f changed
    # scripts/tests/smoke-install.sh; ba15c71 changed scripts/doctor.sh and
    # the installer write-safety e2e; this job invokes all of them.
    # Attributing the spread to the RUNNER would need repeated runs at ONE
    # sha, which nobody has done. So this block sizes on the observed
    # maximum and claims no cause. (The runner-variance class is real in
    # this repo — S327: the hook-latency gate measured 77 ms locally and
    # 209-435 ms in CI on the SAME sha — but that is a precedent, not
    # evidence about these seven numbers.)
    # 126 leaves 33m28s over the observed max (1.36x); 150 leaves 57m28s
    # (1.62x). The house rule fires below 20% headroom and 126 was still
    # ABOVE it at 26.6% — so the trigger that fired is not that one. The
    # S336 deferral (Owner, 2026-09-01) named three, and this is the third:
    # the next wave that already touches `.github/workflows/` takes the bump
    # along at ~zero marginal cost. That wave is PLAN-186 W4a.
    # What is deliberately NOT claimed: this is not a prediction that the
    # job will take 150 minutes, and the W4a deletion riding in the same
    # patch touches `validate.yml`, not this job — no number here is
    # adjusted for it. Re-tighten on a real CI p95 with >= 3 further
    # samples, never on arithmetic (AGENTS.md:9-11: this file records
    # measurements and subtractions, never speed claims).
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-pinned (Sprint 7 Dependabot bump): actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      # PLAN-169 W2.8 (ADR-192, route (b)-narrow) — gate-scripts integrity.
      # Same canonical manifest as release.yml: the free scripts whose
      # verdict this gate consumes (validate-governance.sh here) must match
      # .claude/governance/gate-scripts-manifest.txt or the run fails loudly
      # BEFORE any member is invoked. Residual (documented in ADR-192):
      # the parity step later runs the INSTALLED copy of
      # validate-governance.sh inside the target — that copy is delivered
      # from this verified repo copy by install.sh in this same run.
      - name: Gate-scripts integrity (W2.8 checksum manifest)
        run: |
          set -euo pipefail
          M=.claude/governance/gate-scripts-manifest.txt
          [[ -f "$M" ]] || { echo "::error::$M missing (W2.8 canonical manifest)"; exit 1; }
          shasum -a 256 -c "$M" \
            || { echo "::error::gate-script drift vs $M (ADR-192) — member edits go through the canonical-edit ceremony"; exit 1; }
          echo "OK: all gate scripts match $M"

      # PLAN-166 F4: the parity e2e's historical leg installs from a PINNED
      # TAG. `fetch-depth: 1` produces a checkout with NO tags, so the pin
      # would not resolve and the gate would die before comparing a single
      # tree - "it passes on my clone" is precisely the hole this test exists
      # to close. The pin is READ FROM THE TEST (--print-pin) so the workflow
      # never becomes a second copy of that truth.
      - name: Fetch the parity pin tag
        run: |
          set -euo pipefail
          PIN="$(bash scripts/tests/test-install-upgrade-parity-e2e.sh --print-pin)"
          echo "parity historical pin: $PIN"
          git fetch --no-tags --depth 1 origin "+refs/tags/$PIN:refs/tags/$PIN"
          git rev-parse --verify "refs/tags/$PIN^{commit}"
          # S313: the schema-generation pin guard derives the set of prior
          # schema generations from EVERY release tag (the set an adopter
          # could have installed). Depth-1 per tag — a handful of trees.
          git fetch --no-tags --depth 1 origin "+refs/tags/v*:refs/tags/v*"
          echo "release tags fetched: $(git tag -l 'v[0-9]*' | wc -l)"

      - name: Setup Python 3.11
        # SHA-pinned (Sprint 7 Dependabot bump): actions/setup-python@v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install jq (for settings.json merge)
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          jq --version

      # PLAN-168 W1 (AC-4, per-PR half): the DECISION oracle —
      # _ownership_verdict() against every truth-table cell, in milliseconds.
      # The OBSERVATION half (the ~25-min e2e) runs in ownership-nightly.yml;
      # this fast half is what makes table/harness PRs cheap to gate.
      - name: Ownership verdict unit oracle (milliseconds)
        run: |
          set -euo pipefail
          bash scripts/tests/test-ownership-verdict-unit.sh

      # rail round-1 F6 — the delivery-route resolution oracle for the
      # CANONICAL manifest generator (D3). Measured S327: this test was
      # referenced by NOTHING but itself, so its independent
      # installer-versus-table truth derivation and its malformed-row /
      # escaping-row controls never executed in CI. Seconds to run, no
      # network, mktemp -d only.
      # `if: always()` for the PLAN-183 §9.8 reason: it is the instrument that
      # certifies the route table the delivery steps below depend on, so it is
      # exactly the step that must not report `skipped` when something earlier
      # in the job is red.
      - name: Delivery-route resolution oracle (manifest generator, D3)
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-manifest-delivery-route.sh

      # rail round-2 F4 — the OTHER canonical consumer of the same table.
      # Measured S327: `grep -r test-doctor-delivery-route.sh .github/` = 0, so
      # doctor.sh's route resolution, its restore/`--repair` confinement cases
      # and the anti-rot assertions that no private parser grew back had NO CI
      # execution at all — the D4 contamination leak (the maintainer's live
      # .github/CODEOWNERS copied into an adopter tree) is exactly what these
      # 59 assertions detect, and nothing was running them.
      # ~107 s local (Darwin arm64) — cheap enough for per-PR, unlike the
      # install-baseline manifest suite, which went to ownership-nightly.yml.
      # `if: always()` for the same PLAN-183 §9.8 reason as the step above: it
      # certifies the table the delivery steps below depend on.
      - name: Delivery-route resolution oracle (doctor restore/repair, D4)
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-doctor-delivery-route.sh

      # Re-pass rc.4 t7 P2 (t6 condition 5): the gitignore symlink-refusal +
      # dry-run preview unit is seconds — run it per-PR. The full
      # install-state replay (B2 pre-state ceremony persistence + B2-c3/c4
      # schema-refresh, --skip and symlink-refusal legs) is many minutes of
      # real installs and runs in ownership-nightly.yml instead.
      - name: Gitignore symlink + dry-run preview unit (t7)
        run: |
          set -euo pipefail
          bash scripts/tests/test-gitignore-symlink-and-dryrun-unit.sh

      # S313: upgrade.sh refreshes the plans/ schema docs HASH-GATED against
      # a hand-written list of prior generations. A schema edit that forgets
      # to append the replaced generation's hash leaves every adopter on it
      # STALE (the parity e2e went red on 996d72b for exactly this). The
      # guard derives the generation set from the release tags fetched
      # above (+ history when available) — zero enumerable generations is a
      # scaffold FAILURE (exit 2), never a green skip.
      - name: Schema-doc prior-generation pins are complete (S313 guard)
        run: |
          set -euo pipefail
          bash scripts/tests/test-schema-generation-pins-unit.sh

      # PLAN-168 W1 (rail r3 P1): the nightly gate's fake-harness control is
      # milliseconds — run it per-PR so a PR touching the gate cannot break
      # its rc/status handling while PR checks stay green.
      - name: Ownership nightly-gate positive control (fake harness)
        run: |
          set -euo pipefail
          bash scripts/tests/test-ownership-nightly-gate.sh

      # PLAN-183 W5 fix (S327b, measured in smoke run 32845976930): this deepen
      # step MUST run BEFORE the parity e2e, not only before the historical e2e.
      # The D1 hash-gate in upgrade.sh recognises an adopter file as framework-
      # owned by matching it against the git GENERATIONS of the template SOURCE;
      # with the depth-1 checkout the v1.2.0 generation is invisible, the three
      # templates that diverged (docs/BRANCH-PROTECTION.md and the two workflow
      # .template files) fall to PRESERVED, and the classifier reports STALE 3 —
      # locally, with full history, the same tree measures STALE 0. Safe but
      # blind: a shallow SOURCE never delivers wrong bytes, it just cannot see.
      # `actions/checkout` above runs at `fetch-depth: 1` and the later fetches
      # are `--depth 1` TAG fetches, so `git log -- <path>` sees exactly ONE
      # commit: the H.3 fixture can find no PRIOR generation of
      # templates/docs/BRANCH-PROTECTION.md and the test scaffold-errors on
      # every run.
      # MEASURED (S327, this repo): that template has TWO generations — the
      # current one landed at depth 40, the only differing one is the ROOT
      # commit at depth 502 of 503 total. There is therefore no honest
      # `--deepen=<N>` short of the whole history, so this unshallows: 503
      # commits / 43 MB of .git, seconds against a 50-minute job.
      # `--no-tags` keeps the explicit pin/release tag fetches above
      # authoritative over which tags this checkout holds.
      # `if: always()` is NOT optional here: the step it feeds carries
      # always(), so without it a red earlier step would skip the deepen and
      # run the e2e shallow — turning the cure back into the finding.
      - name: Deepen git history (parity + historical-adopter e2e need prior generations)
        if: always()
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags
            echo "unshallowed: $(git rev-list --count HEAD) commits now reachable"
          else
            echo "already complete: $(git rev-list --count HEAD) commits reachable"
          fi
          # Fail CLOSED if the deepen did not actually produce what the e2e
          # needs. A green step here followed by a scaffold error there would
          # point the blame at the test instead of at this step.
          gens="$(git log --format=%H -- templates/docs/BRANCH-PROTECTION.md | wc -l | tr -d ' ')"
          echo "generations of templates/docs/BRANCH-PROTECTION.md: $gens"
          if [ "$gens" -lt 2 ]; then
            echo "::error::history deepen did not expose a prior generation (gens=$gens); the historical-adopter e2e cannot run" >&2
            exit 1
          fi

      # PLAN-168 W2 (AC-6, per-PR half of INV-4): the shared pointer
      # generator's 8-scenario control — includes ONE real install (~1-2 min
      # on CI iron). The full install->upgrade->cure e2e (4 legs, ~5 min CI)
      # is nightly-only; MEASURED per the smoke budget notes above.
      - name: Protocol pointer render control (generator parity)
        run: |
          set -euo pipefail
          bash scripts/tests/test-protocol-pointer-render.sh

      - name: Run smoke install
        run: |
          set -euo pipefail
          bash scripts/tests/smoke-install.sh

      # PLAN-161 upgrade oracles (green only once the U1/U2/U3 upgrade.sh
      # fixes are in-tree — land atomically with them).
      - name: Upgrade oracle — --dry-run identity (U1)
        run: |
          set -euo pipefail
          bash scripts/tests/test-upgrade-dryrun-identity.sh

      - name: Upgrade oracle — exclusion parity + opt-in purge (U2/U3)
        run: |
          set -euo pipefail
          bash scripts/tests/test-upgrade-exclusions.sh

      # WS4-user-ceremony-leg
      - name: Install with --ceremony user (governance rc=0 + no out-of-.claude writes)
        run: |
          set -euo pipefail
          U="$(mktemp -d)"
          ( cd "$U" && git init -q )
          CEO_INSTALL_SKIP_SELF_SHA=1 CEO_RAG_INSTALL_PROMPT=0 \
            bash scripts/install.sh "$U" --ceremony user
          echo '--- validate-governance.sh (user) ---'
          ( cd "$U" && bash .claude/scripts/validate-governance.sh )
          echo '--- assert only .claude/ at top level ---'  # WS4-sc2010-glob
          extra=""
          for _e in "$U"/* "$U"/.[!.]* "$U"/..?*; do
            [ -e "$_e" ] || continue
            _b="$(basename "$_e")"
            case "$_b" in .claude|.git) continue ;; esac
            extra="$extra $_b"
          done
          if [ -n "$extra" ]; then
            echo "::error::--ceremony user wrote outside .claude/:$extra"
            exit 1
          fi
          echo 'user-ceremony leg: PASS'

      # PLAN-166 F4 (OQ-4) - install/upgrade parity on the RESULTING TREES,
      # per ceremony mode. NO continue-on-error, deliberately: the assertion
      # this replaces was dead twice over (tautological AND wired into no
      # workflow), and an escape hatch here would reinstate exactly that.
      # Exit 2 (KNOWN-OPEN) is a FAILURE too - it NAMES the outstanding
      # PLAN-166 W1 prerequisites instead of skipping them silently.
      - name: Install/upgrade parity e2e (maintainer + user ceremony)
        run: |
          set -euo pipefail
          bash scripts/tests/test-install-upgrade-parity-e2e.sh

      # Control of the control (AC-4). With ONE backup_and_replace line deleted
      # from a COPY of upgrade.sh, the gate above must come back RED in EVERY
      # ceremony mode. rc must be exactly 1: rc 0/2 means the gate went blind,
      # rc 9 means the plant stopped biting (vacuous control). Both fail here.
      # This step MUST stay AFTER the plain gate: if the un-planted run were
      # already fatal, rc=1 here would prove nothing about the plant.
      # PLAN-183 W5 (§9.8) — `if: always()`. Observed in run 32639637945: with
      # the main parity step FAILING (D1 open), this control and the two steps
      # below all reported `skipped`. That is the worst possible moment to
      # lose them: the control is the step that answers "does the classifier
      # still DETECT a planted divergence?", so a later green main step would
      # be certified by an instrument whose detection power was never
      # re-verified in the same run — the "instrumento verde cuja PERGUNTA
      # envelheceu" class. The Check: in a run with the main step RED, this
      # step must report success or failure, NEVER skipped.
      # TRADE-OFF, deliberate: always() also runs on a CANCELLED job (an
      # operator cancel, or the job-level timeout, which surfaces as a cancel).
      # `!cancelled()` would exclude that case; always() is what PLAN-183 §9.8
      # specifies, and the cost is bounded by the job timeout below.
      - name: Install/upgrade parity - positive control (planted divergence)
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash scripts/tests/test-install-upgrade-parity-e2e.sh \
            --positive-control > /tmp/parity-control.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat /tmp/parity-control.log
            echo "::error::parity positive control returned rc=$rc, expected 1 - the planted install/upgrade divergence did NOT turn the gate red, so the gate above proves nothing"
            exit 1
          fi
          # Second factor, LOAD-BEARING (re-pass closure): under `set -uo
          # pipefail` (no -e) a non-matching grep would NOT fail the step, so
          # an rc=1 from a failure UNRELATED to the plant (log with none of
          # the plant markers) would pass — the registered-vacuous class
          # (S292) this step exists to close. Demand plant evidence or fail.
          # PLAN-169 W3.2 (fecha a exceção nomeada do AC-4 do PLAN-166,
          # achado r6-P2): o fator antigo aceitava evidência NÃO-causal —
          # qualquer um dos 3 marcadores, mesmo sem o controle ter
          # DISPARADO. Exigir a linha que só existe quando o plante
          # disparou em TODOS os modos, e nenhum veredito por modo :0/:2.
          { grep -qF 'positive control: FIRED in every mode' /tmp/parity-control.log \
            && ! grep -E 'per-mode verdicts.*:(0|2)' /tmp/parity-control.log >/dev/null; } || {
            cat /tmp/parity-control.log
            echo "::error::rc=1 but the log carries no PLANTED/per-mode-verdict evidence - the control went red for an unrelated reason, which proves nothing about the plant (vacuous control)"
            exit 1
          }
          echo "positive control OK: planted divergence -> exit 1 in every ceremony mode"

      # PLAN-166 F3 (ADR-155-AMEND-1, AC-3) — delivery-record ownership of
      # the three conditional framework surfaces (SPEC/v1, root PROTOCOL.md,
      # .claude/.framework-version) across install -> upgrade -> doctor ->
      # updater. Scenarios S1-S8 incl. the forced-refresh route (S2), the
      # legacy ADOPTER-FORK preserve (S4) and the marker-first updater
      # regression (S6). Same wiring rationale as the parity e2e above:
      # scripts/tests/*.sh runs ONLY here — unwired = no test. NO
      # continue-on-error, deliberately.
      # PLAN-183 W5 (§9.8): delivery-record OWNERSHIP is exactly the area this
      # wave widens, so it must not go `skipped` on a red main gate.
      - name: Upgrade SPEC/marker delivery-record ownership (S1-S8)
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-upgrade-spec-ownership.sh

      # PLAN-177 W1 (CF-9) - EFFICACY of the posture-state ignores, which no
      # parity check can see: an ignore that does not work is equally broken on
      # both routes, so it is byte-identical and every parity gate stays green.
      # Simulates the two files `/night-mode on` leaves behind (arming the real
      # posture is a HUMAN action, PLAN-165 OQ1-redo) and asserts git reports
      # neither, in the upgrade route AND in the fresh --ceremony user install
      # the GA re-pass named as the damaged population. Each scenario carries an
      # inline positive control that cannot be switched off. Needs the pin tag
      # fetched above. NO continue-on-error, deliberately.
      - name: night-mode ignore efficacy (upgrade route + user ceremony)
        # PLAN-183 W5 (§9.8): third of the three steps observed as `skipped`
        # in run 32639637945.
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-night-mode-ignore-effect.sh

      # PLAN-183 W5 (D1 + OQ-5) — upgrade.sh delivers docs/ + .github/, and it
      # reaches the HISTORICAL adopter. Two things no other check here can
      # see: (a) the parity e2e observes the CONSEQUENCE (STALE) but never the
      # per-destination ownership verdict that produced the write, and (b) its
      # route B installs at v1.2.0, which already writes install-state, so it
      # is structurally incapable of exercising the OQ-5 amendment (class C2:
      # a Check that only exercises the pinned path passes vacuously). This
      # test BLINDS the state on purpose. It also carries the two negative
      # controls that keep the positive assertions honest: a never-installed
      # directory must receive NOTHING, and a dangling-symlink destination
      # must be preserved rather than written through (PLAN-183 §9.1 class).
      # `if: always()` for the same §9.8 reason as the three steps above.
      # NO continue-on-error, deliberately.
      # rail round-1 F3 — DEEPEN THE HISTORY the step below needs.
      - name: Upgrade historical-adopter delivery (D1 + OQ-5 amendment)
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-upgrade-historical-adopter.sh

      # PLAN-185 W1+W2 (AC-3 Check (d)) — the installer must not write outside
      # the directory it was given, and --github-owner must not be able to
      # leave .github/CODEOWNERS empty for ever. Nothing else in CI can see
      # either defect: the parity and ownership e2e above compare TARGETS, and
      # a write that lands OUTSIDE the target is invisible to a comparison of
      # what is inside it. Every F1 leg asserts on BYTES at an external path,
      # never on the exit code — the pre-cure installer exits 0 while writing
      # outside the target, so an exit-code assertion would have passed
      # against the defect (plan AC-1, debate consensus C2/C4).
      # NEGATIVE CONTROL (debate consensus C12): the file must be PROVED
      # present before it is invoked. Renaming or deleting the e2e is exactly
      # the drift this step exists to catch, and a step that reports success
      # because it ran nothing is the "red gate nobody runs" class the two
      # oracles above were wired to close.
      # `if: always()` for the same PLAN-183 §9.8 reason as the seven steps
      # above that carry it: a security oracle must not report `skipped`
      # because something earlier in the job is red. NO continue-on-error,
      # deliberately.
      - name: Installer write-confinement e2e (F1 symlink/hardlink, F2 CODEOWNERS)
        if: always()
        run: |
          set -euo pipefail
          T=scripts/tests/test-installer-write-safety-e2e.sh
          if [[ ! -f "$T" ]]; then
            echo "::error::$T is missing — the write-confinement e2e was renamed, moved or deleted. This step must never pass without running it (PLAN-185 AC-3)."
            exit 1
          fi
          bash "$T"
      # PLAN-169 W-E (S329) — upgrade.sh derives the hook roster it registers
      # from templates/settings/settings.base.json rather than carrying a
      # second copy of it. Nothing else here can see this: the parity e2e
      # compares install against upgrade on the SAME tree (a roster missing
      # from both is byte-identical and green), and test_template_dogfood_parity
      # compares dogfood to template, never dogfood to THE RESULT OF AN
      # UPGRADE — which is exactly why check_ledger_checkpoint.py shipped for
      # a whole wave with its script on disk and its registration nowhere
      # (S328). Its E.3 red control replays `git show HEAD:scripts/upgrade.sh`,
      # which a depth-1 checkout satisfies (HEAD, not a prior generation) — so
      # unlike the two steps above it does NOT depend on the deepen. Once this
      # patch lands, HEAD carries the cure and E.3 reports itself EXPIRED by
      # name instead of asserting a falsehood; re-arming it means pinning the
      # pre-cure commit, and that is deliberate maintenance, not a failure.
      # `if: always()` for the same §9.8 reason as the five steps above.
      # NO continue-on-error, deliberately.
      - name: Upgrade hook-roster derivation (W-E — template is the roster)
        if: always()
        run: |
          set -euo pipefail
          bash scripts/tests/test-upgrade-lifecycle-hooks-derived.sh

      - name: Assert npx/npm shim contract (if present)
        # Phase 4 deliverable; skip if directory missing
        run: |
          set -euo pipefail
          if [[ -d "npm" ]]; then
            # Check no runtime deps
            if [[ -f npm/package.json ]]; then
              deps=$(jq '.dependencies // {} | length' npm/package.json)
              if [[ "$deps" -ne 0 ]]; then
                echo "::error::ceo-orchestration must ship with 0 runtime deps (got $deps)"
                exit 1
              fi
              echo "OK: npm shim has zero runtime dependencies"
            fi
          else
            echo "npm/ shim not yet present — skipping"
          fi
