name: Ownership Nightly

# PLAN-168 W1 (AC-4/AC-5, Owner decision D4): the ownership e2e runs the FULL
# truth table — 65 real install/upgrade cells (62 GREEN + 3 expected RED;
# prose was stale at 62/4 — repass-r2 part-e P2), ~25 min locally, 2-3x that on a
# 2-core runner — so it cannot live inside smoke-install's 25-min job (that
# budget was already raised 4x: 5→8→20→25). And `schedule:` events IGNORE
# `paths:` filters, so the nightly split is a separate WORKFLOW, not a filter
# entry (debate r1 devops must-fix 1). The fast per-PR half (the unit oracle)
# stays in smoke-install.yml.
#
# The gate compares the observed non-GREEN set against
# scripts/tests/ownership-expected-reds.txt and fails on ANY difference —
# including shrinkage. 3 deliberate reds are part of the contract
# (CLAUDE.md §4): an all-green run means the table changed — STOP and find
# out why, never celebrate. NEVER run the harness with --map here: --map is a
# reporting mode that exits 0 over failures (a dead gate by construction).

on:
  schedule:
    # Off-peak UTC, off-minute deliberately (fleet etiquette — avoid :00/:30).
    - cron: "43 6 * * *"
  # Manual runs for harness/table PRs that want the full e2e before merge.
  workflow_dispatch: {}

concurrency:
  group: ownership-nightly
  cancel-in-progress: true

jobs:
  ownership-e2e:
    # PLAN-012 Phase 2 CEO_SOTA_DISABLE parity (same switch as smoke-install).
    if: vars.CEO_SOTA_DISABLE != '1'
    runs-on: ubuntu-latest
    # ~25 min local (Darwin arm64, 16 cores, 2026-08-07); ubuntu-latest is the
    # usual 2-3x slower => 50-75 min expected. Same anti-flake sizing rule as
    # the smoke-install budget notes: leave headroom, re-tighten on a real p95.
    # rail round-2 F4: 110 -> 150. The baseline-manifest suite wired below is
    # ~11-15 min local => 22-45 CI minutes at the same factor, and 110 was
    # already sized for e2e (50-75) + replay (22-33) + INV-4 with little slack.
    # A job-level timeout that clips a GREEN run surfaces as `cancelled` on an
    # innocent step (the S2xx lesson this file's siblings record), so the
    # margin is deliberate — re-tighten on a real p95, never on arithmetic.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-pinned (same pin as smoke-install.yml): actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      # PLAN-169 W2.8 (ADR-192, route (b)-narrow) — gate-scripts integrity.
      # ownership-nightly-gate.sh decides this workflow's verdict (the
      # exact expected-RED set); it is a free script, so its bytes are
      # pinned by the canonical manifest. Drift = loud fail BEFORE the
      # e2e spends ~40 min of runner time on a gate that would lie.
      - name: Gate-scripts integrity (W2.8 checksum manifest)
        run: |
          set -euo pipefail
          M=.claude/governance/gate-scripts-manifest.txt
          [[ -f "$M" ]] || { echo "::error::$M missing (W2.8 canonical manifest)"; exit 1; }
          shasum -a 256 -c "$M" \
            || { echo "::error::gate-script drift vs $M (ADR-192) — member edits go through the canonical-edit ceremony"; exit 1; }
          echo "OK: all gate scripts match $M"

      # `fetch-depth: 1` produces a checkout with NO tags, and the
      # legacy_pristine* fixtures build from a REAL shipped tree. The tag is
      # READ FROM THE HARNESS (--print-legacy-tag) so this workflow never
      # becomes a second copy of that truth (same --print-pin shape as the
      # parity e2e in smoke-install.yml).
      - name: Fetch the legacy_pristine tag
        run: |
          set -euo pipefail
          TAG="$(bash scripts/tests/test-ownership-table.sh --print-legacy-tag)"
          echo "legacy pristine tag: $TAG"
          git fetch --no-tags --depth 1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git rev-parse --verify "refs/tags/$TAG^{commit}"

      - name: Install jq (install.sh settings merge dependency)
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          jq --version

      # Fast preflight: a broken DECISION should fail in milliseconds here,
      # not 40 minutes into the observation run.
      - name: Ownership verdict unit oracle (preflight)
        run: |
          set -euo pipefail
          bash scripts/tests/test-ownership-verdict-unit.sh

      # Re-pass rc.4 t7 P2 (t6 condition 5): the install-state replay suite
      # was local/landing-gate only — CI could stay green after regressions
      # in pre-state ceremony persistence (B2-c2), hash-gated schema refresh
      # (B2-c3) or its symlink-refusal / --skip / hasher-fallback legs
      # (B2-c4). ~11 min local (Darwin arm64); budgeted ~2-3x here, inside
      # this job's timeout headroom (bumped 90 -> 110, same measured
      # anti-flake sizing rule as smoke-install's F4 bump).
      - name: Install-state replay suite (B2 — ceremony, schema refresh, symlink refusal)
        run: |
          set -euo pipefail
          bash scripts/tests/test_install_state_replay.sh

      # rail round-2 F4 — the baseline-manifest suite (ADR-155 C.2-C.7).
      # Measured S327: `grep -r test_install_baseline_manifest.sh .github/` = 0.
      # It is the ONLY check that observes what install and upgrade RECORD as
      # framework-owned — the C.8 assertions the PLAN-183 W5 patch adds for the
      # docs/ + .github/ delivery records live here, and nothing was running
      # them. Wired HERE and not in smoke-install.yml on purpose: ~11-15 min of
      # real install/upgrade legs locally, i.e. 22-45 CI minutes at this org's
      # 2-3x runner factor, on top of a per-PR job already budgeted at 58 —
      # exactly the sizing argument that put test_install_state_replay.sh in
      # this workflow above (re-pass rc.4 t7 P2).
      #
      # KNOWN-OPEN SET, not continue-on-error. MEASURED on the W5 tree (S327,
      # Darwin arm64, 692 s): 32 passed / 1 failed, the failure being C.6.2
      # "root PROTOCOL.md NOT backed up without a manifest" — PRE-EXISTING and
      # not this wave's (the W5 patch adds 95 lines to that file and touches
      # ZERO C.6 lines). Wiring it as a plain `bash ...` would paint this
      # workflow red every night for a defect it did not cause, which is how a
      # channel gets trained to be ignored. So the step declares the failing
      # SET and fails on ANY difference — a NEW failure and a DISAPPEARING one
      # both go red, the same contract ownership-expected-reds.txt enforces for
      # the e2e below (CLAUDE.md §4: shrinkage is a change, never a success).
      # `continue-on-error` is deliberately absent: it would reinstate exactly
      # the "red gate nobody runs" class this step closes.
      # RESIDUAL, declared: C.6.2 was measured on Darwin only. If ubuntu passes
      # it, this step goes red on its FIRST nightly with a message naming the
      # difference — that is the intended failure mode (an unmeasured
      # assumption failing loudly), not a regression. The right long-term home
      # for EXPECTED is a tracked declaration file next to
      # ownership-expected-reds.txt.
      - name: Install baseline-manifest suite (ADR-155 C.2-C.8 delivery records)
        run: |
          set -uo pipefail
          rc=0
          bash scripts/tests/test_install_baseline_manifest.sh \
            > /tmp/baseline-manifest.log 2>&1 || rc=$?
          tail -40 /tmp/baseline-manifest.log
          if ! grep -qE '^==> RESULT: [0-9]+ passed' /tmp/baseline-manifest.log; then
            echo "::error::baseline-manifest suite produced no RESULT line (rc=$rc) — partial output is never comparable to a declared set"
            exit 1
          fi
          OBSERVED="$(awk '$1 == "FAIL" { print $2 }' /tmp/baseline-manifest.log \
                      | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          # rail round-3 F3 — the declared set is the EXACT assertion id, not
          # the class. The suite has NINE distinct `bad "C.6 ..."` sites; while
          # this compared the bare class, a run where a DIFFERENT C.6 assertion
          # regressed and the known-open one was fixed produced the identical
          # OBSERVED string and the nightly reported success. Each site now
          # carries a stable C.6.<n> id (see the ASSERTION IDS header of
          # scripts/tests/test_install_baseline_manifest.sh); C.6.2 is the one
          # measured failing at HEAD ("root PROTOCOL.md NOT backed up without a
          # manifest"), pre-existing and not caused by PLAN-183 W5.
          EXPECTED="C.6.2"
          if [ "$OBSERVED" != "$EXPECTED" ]; then
            echo "::error::baseline-manifest failing set CHANGED — declared [$EXPECTED], observed [$OBSERVED]. A NEW id is a regression; a MISSING id means the known-open defect was fixed and this declaration must be updated in the same commit. Never widen it to make the red go away."
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::rc=0 while [$EXPECTED] is reported failing — the suite's exit code and its own output disagree, so neither can be trusted"
            exit 1
          fi
          echo "OK: baseline-manifest failing set matches the declared known-open set [$EXPECTED] (suite rc=$rc)"

      # PLAN-168 W2 (AC-6/AC-6b): INV-4 as an executable assertion — install
      # and upgrade produce the SAME pointer (byte identity + content
      # soundness), repeat upgrades are idempotent, a degraded body is CURED
      # with backup, and an adopter-customized pointer is PRESERVED (S238).
      - name: Protocol pointer INV-4 e2e (4 legs)
        run: |
          set -euo pipefail
          bash scripts/tests/test-protocol-pointer-inv4.sh

      # The gate itself is proven BEFORE it is trusted: every failure mode it
      # claims to catch is planted with a fake harness and must go red. A CI
      # gate nobody can test is a gate nobody has proven (PLAN-167: 8
      # instrument defects).
      - name: Gate positive control (planted failure modes)
        run: |
          set -euo pipefail
          bash scripts/tests/test-ownership-nightly-gate.sh

      # PLAN-168 AC-5 — the SCRIPT is the gate (debate r1 QA must-fix 2:
      # describing behavior is not a gate). ownership-nightly-gate.sh runs the
      # e2e and enforces: rc>=2 = infra error (never comparable); summary line
      # present with HARNESS-ERR=0 (partial output fails); observed non-GREEN
      # id set == scripts/tests/ownership-expected-reds.txt exactly; rc
      # coherent with the set (non-empty => rc=1, empty => rc=0). NEVER --map.
      - name: Ownership e2e — full table vs expected non-GREEN set
        env:
          # 60s/cell flakes on 2-core CI iron (2-3x slower than the local
          # baseline the default was sized on).
          CELL_TIMEOUT: "180"
        run: |
          set -euo pipefail
          bash scripts/tests/ownership-nightly-gate.sh
